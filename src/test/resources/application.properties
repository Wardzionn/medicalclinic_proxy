spring.application.name=githubproxy

#Feign
spring.cloud.openfeign.client.config.visitClient.url=http://localhost:${wiremock.server.port}
spring.cloud.openfeign.client.config.doctorClient.url=http://localhost:${wiremock.server.port}
# Use OkHttp so PATCH is supported (JDK HttpURLConnection rejects it)
spring.cloud.openfeign.okhttp.enabled=true
logging.level.com.wardzionn.githubproxy.client.visitClient=DEBUG
logging.level.com.wardzionn.githubproxy.client.doctorClient=DEBUG

#circuitbreaker
spring.cloud.openfeign.circuitbreaker.enabled=true

# Keep resilience4j circuit closed during tests so the fallback path is exercised
# via the underlying Feign exception, not a half-open short-circuit.
resilience4j.circuitbreaker.instances.doctorClient.sliding-window-size=100
resilience4j.circuitbreaker.instances.doctorClient.minimum-number-of-calls=100
resilience4j.circuitbreaker.instances.visitClient.sliding-window-size=100
resilience4j.circuitbreaker.instances.visitClient.minimum-number-of-calls=100

#port
server.port=8080
